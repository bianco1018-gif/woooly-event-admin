name: Deploy WOOOLY event data

on:
  push:
    branches:
      - main
    paths:
      - "site/data/events.json"
      - "site/js/event.js"
      - ".github/workflows/deploy-events.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload event files to StarServer
        env:
          FTP_BASE_URL: ${{ secrets.FTP_BASE_URL }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

        run: |
          set -euo pipefail

          BASE="${FTP_BASE_URL%/}"

          echo "Uploading events.json..."

          curl --fail --show-error \
            --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file "site/data/events.json" \
            "${BASE}/data/events.json"

          echo "Uploading event.js..."

          curl --fail --show-error \
            --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file "site/js/event.js" \
            "${BASE}/js/event.js"

          echo "WOOOLY event files deployed successfully."
